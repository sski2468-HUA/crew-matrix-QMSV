<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>船員資歷填單 — FPMC</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1c3a5e; --navy-2:#234a72; --navy-3:#2f6690;
  --paper:#f5f7f8; --card:#ffffff; --line:#dde4e8; --line-2:#c3ced5;
  --ink:#15262f; --ink-2:#52656f; --ink-3:#8195a0;
  --signal:#e8842c; --signal-d:#c96a14;
  --ok:#2e8b57; --bad:#c0392b; --bad-l:#fbeae7;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);font-family:var(--sans);color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 0 60px}
header{background:var(--navy);color:#fff;padding:22px 18px}
header h1{margin:0;font-size:19px}
header p{margin:6px 0 0;font-size:13px;color:#b9c8d6;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:520px){.grid.two{grid-template-columns:1fr 1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:600}
input,select{padding:11px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:15px;font-family:var(--sans);color:var(--ink);background:#fff;width:100%}
input:focus,select:focus{outline:2px solid var(--navy-3);outline-offset:1px}
.voybox{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fafbfc;position:relative}
.voybox .rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--bad);font-size:18px;cursor:pointer;padding:4px}
.voybox .idx{font-size:11px;color:var(--ink-3);font-weight:700;margin-bottom:8px}
.cargo-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.cargo-row label{flex-direction:row;align-items:center;gap:5px;font-weight:500;font-size:13px;color:var(--ink)}
.cargo-row input[type=checkbox]{width:auto}
.onboard-row{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.onboard-row input[type=checkbox]{width:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:11px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-family:var(--sans);font-weight:600}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff;width:100%;justify-content:center;font-size:16px;padding:14px}
.btn.ghost{background:#fff}
.btn.block{width:100%;justify-content:center}
.hint{color:var(--ink-3);font-size:12px;line-height:1.7}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none;z-index:99;max-width:90vw;text-align:center}
#toast.err{background:var(--bad)}
#successView{display:none;text-align:center;padding:60px 20px}
#successView .icon{font-size:52px;margin-bottom:14px}
#confirmOverlay{display:none;position:fixed;inset:0;background:rgba(17,28,40,.55);z-index:200;overflow:auto;padding:20px 0}
#confirmOverlay .sheet{background:#fff;border-radius:12px;max-width:600px;margin:0 auto 30px;padding:18px}
#confirmOverlay h2{margin:0 0 4px;font-size:17px}
#confirmOverlay .warn{background:#fdf1e4;border:1px solid #f3d3ab;color:var(--signal-d);border-radius:8px;padding:10px 12px;font-size:12.5px;margin:10px 0 14px;line-height:1.7}
.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
.confirm-grid div b{display:block;color:var(--ink-3);font-size:10.5px;font-weight:600}
.confirm-voy{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;line-height:1.8}
.confirm-actions{display:flex;gap:8px;margin-top:16px}
.confirm-actions .btn{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚓ 船員海上資歷填單</h1>
    <p>手機也能填，填完送出後會有專人審核，確認無誤才會正式匯入系統。請確實填寫，方便核對您的年資與 Crew Matrix 資料。</p>
  </header>

  <div id="formView">
    <div class="card">
      <h2>基本資料</h2>
      <div class="grid two">
        <label>姓名（中文）<input type="text" id="f-name" required></label>
        <label>英文姓名<input type="text" id="f-name_en" placeholder="例：WANG XIAO MING"></label>
        <label>勞務公司<input type="text" id="f-manning"></label>
        <label>現職<input type="text" id="f-rank" placeholder="例：3/O"></label>
        <label>國籍<input type="text" id="f-nat" placeholder="例：ROC"></label>
        <label>進公司日<input type="date" id="f-join"></label>
        <label>證書種類<input type="text" id="f-coc" placeholder="例：3/O"></label>
        <label>發證國<input type="text" id="f-issuing" placeholder="例：ROC"></label>
        <label>Tanker 證書<input type="text" id="f-tanker" placeholder="例：Oil/Chem"></label>
        <label>STCW V<input type="text" id="f-stcw" placeholder="例：Para 2"></label>
        <label>電台證書<input type="text" id="f-radio" placeholder="例：GOC"></label>
        <label>英語能力<input type="text" id="f-english" placeholder="例：GOOD"></label>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <h2 style="margin:0">海上資歷</h2>
        <span class="hint" style="margin-left:auto">請由舊到新依序填寫</span>
      </div>
      <div id="voyList" style="margin-top:12px"></div>
      <button class="btn ghost block" id="btnAddVoy" type="button">＋ 新增一筆航次</button>
    </div>

    <div class="card">
      <button class="btn primary" id="btnSubmit" type="button">✓ 送出填單</button>
      <p class="hint" style="margin-top:10px;text-align:center">送出後如需修改，請直接聯絡海技組協助處理。</p>
    </div>
  </div>

  <div id="successView">
    <div class="icon">✅</div>
    <h2>已送出，謝謝您！</h2>
    <p class="hint">您的資料已送交審核，確認無誤後會正式匯入系統。已自動幫您下載一份 Excel 備份，請自行保存。</p>
    <button class="btn ghost" onclick="location.reload()">再填一筆</button>
  </div>
</div>

<div id="confirmOverlay">
  <div class="sheet">
    <h2>請核對填寫內容</h2>
    <p class="hint">送出後如需修改要另外聯絡海技組，請仔細確認以下內容是否正確。</p>
    <div class="warn">⚠ 確認送出後會同時自動下載一份 Excel 備份檔，建議自行保存一份。</div>
    <div id="confirmBody"></div>
    <div class="confirm-actions">
      <button class="btn ghost block" id="btnConfirmBack" type="button">← 返回修改</button>
      <button class="btn primary" id="btnConfirmSend" type="button">✓ 確認無誤，送出</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const CLOUD = {
  url: "https://iqmbircjokdzdssouwkr.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxbWJpcmNqb2tkemRzc291d2tyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNDAwODIsImV4cCI6MjA5NjgxNjA4Mn0.OZ2ez6ondz49kT90gwneYUXG7CbE8iiB6PnXE5fR6iY"
};
const TYPES=["Chem","Oil/Chem","Oil","Gas","Other"];
const TYPE_CN={Chem:"化","Oil/Chem":"油/化",Oil:"油",Gas:"氣體",Other:"其他"};
const RANKS=["CAPT.","C/O","2/O","3/O","C/E","2/E","3/E","4/E","Cadet"];
const RANK_CN={"CAPT.":"船長","C/O":"大副","2/O":"二副","3/O":"三副","C/E":"輪機長","2/E":"大管","3/E":"二管","4/E":"三管",Cadet:"實習生"};

let voyCount=0;
function addVoyageRow(){
  voyCount++;
  const id="v"+voyCount;
  const div=document.createElement("div");
  div.className="voybox";
  div.id=id;
  div.innerHTML=`
    <button type="button" class="rm" onclick="document.getElementById('${id}').remove()">✕</button>
    <div class="idx">航次 #${voyCount}</div>
    <div class="grid two">
      <label>職級<select class="v-rank">${RANKS.map(r=>`<option value="${r}">${r} ${RANK_CN[r]}</option>`).join("")}</select></label>
      <label>船名<input type="text" class="v-ship" placeholder="例：FPMC C Jade 或 台塑真善輪"></label>
      <label>上船日<input type="date" class="v-on"></label>
      <label>下船日<input type="date" class="v-off"></label>
    </div>
    <div class="onboard-row"><input type="checkbox" class="v-onboard" onchange="this.closest('.voybox').querySelector('.v-off').disabled=this.checked"> 目前仍在船上（不用填下船日）</div>
    <div class="cargo-row">
      ${TYPES.map(t=>`<label><input type="checkbox" class="v-type" value="${t}">${TYPE_CN[t]} ${t}</label>`).join("")}
    </div>`;
  document.getElementById("voyList").appendChild(div);
}
document.getElementById("btnAddVoy").addEventListener("click", addVoyageRow);
addVoyageRow(); addVoyageRow();

let toastTimer;
function notify(msg, tone="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className=tone==="err"?"err":"";
  el.style.display="block";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=> el.style.display="none", 4000);
}
function val(id){ return document.getElementById(id).value.trim(); }

function collectFormData(){
  const person={
    name: val("f-name"), name_en: val("f-name_en"), manning_agency: val("f-manning"),
    rank_now: val("f-rank"), nationality: val("f-nat"), join_date: val("f-join")||null,
    coc: val("f-coc"), issuing_country: val("f-issuing"), tanker_cert: val("f-tanker"),
    stcw: val("f-stcw"), radio: val("f-radio"), english: val("f-english"),
  };
  const voyages=[];
  document.querySelectorAll(".voybox").forEach(box=>{
    const ship_name=box.querySelector(".v-ship").value.trim();
    const sign_on=box.querySelector(".v-on").value;
    if(!ship_name || !sign_on) return;
    const onboard=box.querySelector(".v-onboard").checked;
    const sign_off=onboard? null : (box.querySelector(".v-off").value||null);
    const rank=box.querySelector(".v-rank").value;
    const cargo_types=[...box.querySelectorAll(".v-type:checked")].map(c=>c.value);
    voyages.push({rank, ship_name, sign_on, sign_off, cargo_types, note:""});
  });
  return {person, voyages};
}

function escHtml(s){ return String(s??"").replace(/[&<>"']/g, c=> ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderConfirmBody(person, voyages){
  const fields=[["姓名",person.name],["英文姓名",person.name_en],["勞務公司",person.manning_agency],["現職",person.rank_now],
    ["國籍",person.nationality],["進公司日",person.join_date],["證書種類",person.coc],["發證國",person.issuing_country],
    ["Tanker 證書",person.tanker_cert],["STCW V",person.stcw],["電台證書",person.radio],["英語能力",person.english]];
  const fieldsHtml = fields.map(([k,v])=>`<div><b>${escHtml(k)}</b>${escHtml(v||"（未填）")}</div>`).join("");
  const voyHtml = voyages.length
    ? voyages.map((v,i)=>`<div class="confirm-voy"><b>#${i+1}　${escHtml(RANK_CN[v.rank]||v.rank)}</b>　${escHtml(v.ship_name)}<br>${escHtml(v.sign_on)} ～ ${v.sign_off? escHtml(v.sign_off) : "（在船中）"}　船型：${v.cargo_types.length? v.cargo_types.map(t=>TYPE_CN[t]).join("+") : "（未選）"}</div>`).join("")
    : `<p class="hint">目前沒有填寫任何航次資料。</p>`;
  document.getElementById("confirmBody").innerHTML = `
    <div class="confirm-grid">${fieldsHtml}</div>
    <div style="font-size:13px;font-weight:700;margin:12px 0 8px">海上資歷（${voyages.length} 筆）</div>
    ${voyHtml}
  `;
}

/* 產生的格式跟主系統「拖曳匯入」認得的「海上資歷 Service experience」範本一模一樣
   （儲存格位置對齊 index.html 的 parsePersonSheet()），所以這份備份檔案
   之後也能直接拖進系統的匯入功能，不只是留底用。 */
function downloadBackupXlsx(person, voyages){
  const aoa=[];
  const set=(r,c,v)=>{ while(aoa.length<r) aoa.push([]); while(aoa[r-1].length<c) aoa[r-1].push(""); aoa[r-1][c-1]=v; };
  set(1,1,"海上資歷　(Service experience)");
  set(2,1,"姓名："); set(2,4,person.name||""); set(2,5,"勞務公司："); set(2,6,person.manning_agency||""); set(2,7,"英語能力"); set(2,8,person.english||""); set(2,9,"進入公司日期："); set(2,11,person.join_date||"");
  set(3,1,"Name:"); set(3,4,person.name_en||""); set(3,5,"Manning agency:"); set(3,7,"English proficiency"); set(3,9,"Company join date:");
  set(4,1,"現職："); set(4,4,person.rank_now||""); set(4,5,"國籍"); set(4,6,person.nationality||""); set(4,9,"Tank船證書"); set(4,11,person.tanker_cert||"");
  set(5,1,"Rank at present:"); set(5,5,"Nationality"); set(5,9,"Tanker certification");
  set(6,1,"證書種類"); set(6,4,person.coc||""); set(6,5,"發證國"); set(6,6,person.issuing_country||""); set(6,7,"特別證書"); set(6,8,person.stcw||""); set(6,9,"電台證書"); set(6,11,person.radio||"");
  set(7,1,"Certificate of Competency"); set(7,5,"Issuing Country"); set(7,7,"SQ for current cargo（Para 1 or 2）"); set(7,9,"Radio qualification");
  set(9,1,"項次"); set(9,2,"職位"); set(9,4,"船名"); set(9,6,"上船日期"); set(9,7,"下船日期"); set(9,9,"船型 Vessel type（打 V）");
  set(10,1,"No."); set(10,2,"Rank"); set(10,4,"Ship name"); set(10,6,"Date of Sign On"); set(10,7,"Date of Sign Off"); set(10,8,"Days");
  set(10,9,"化"); set(10,10,"油/化"); set(10,11,"油"); set(10,12,"氣體"); set(10,13,"其他");
  set(11,9,"Chem"); set(11,10,"Oil/Chem"); set(11,11,"Oil"); set(11,12,"Gas"); set(11,13,"Other");
  voyages.forEach((v,i)=>{
    const r=12+i;
    set(r,1,i+1);
    set(r,2,RANK_CN[v.rank]||"");
    set(r,3,v.rank||"");
    set(r,4,v.ship_name||"");
    set(r,6,v.sign_on||"");
    set(r,7,v.sign_off||"");
    const colByType={Chem:9,"Oil/Chem":10,Oil:11,Gas:12,Other:13};
    (v.cargo_types||[]).forEach(t=>{ if(colByType[t]) set(r,colByType[t],"V"); });
  });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:6},{wch:10},{wch:8},{wch:20},{wch:14},{wch:15},{wch:15},{wch:8},{wch:6},{wch:8},{wch:6},{wch:6},{wch:6}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "個人資歷");
  const today=new Date().toISOString().slice(0,10).replaceAll("-","");
  XLSX.writeFile(wb, `船員資歷填單備份_${person.name||"未填姓名"}_${today}.xlsx`);
}

document.getElementById("btnSubmit").addEventListener("click", ()=>{
  const {person, voyages}=collectFormData();
  if(!person.name){ notify("請填寫姓名","err"); return; }
  renderConfirmBody(person, voyages);
  document.getElementById("confirmOverlay").style.display="block";
  window.scrollTo(0,0);
});
document.getElementById("btnConfirmBack").addEventListener("click", ()=>{
  document.getElementById("confirmOverlay").style.display="none";
});
document.getElementById("btnConfirmSend").addEventListener("click", async ()=>{
  const {person, voyages}=collectFormData();
  if(!person.name){ notify("請填寫姓名","err"); document.getElementById("confirmOverlay").style.display="none"; return; }
  const btn=document.getElementById("btnConfirmSend");
  btn.disabled=true; btn.textContent="送出中…";
  try{
    const res=await fetch(`${CLOUD.url}/rest/v1/crew_submissions`, {
      method:"POST",
      headers:{
        "apikey":CLOUD.key, "Authorization":"Bearer "+CLOUD.key,
        "Content-Type":"application/json", "Prefer":"return=minimal"
      },
      body: JSON.stringify([{payload:{person,voyages}, submitted_name:person.name, status:"pending"}])
    });
    if(!res.ok){ const t=await res.text().catch(()=> ""); throw new Error(t.slice(0,200)); }
    try{ downloadBackupXlsx(person, voyages); }catch(e){ console.warn("備份下載失敗", e); }
    document.getElementById("confirmOverlay").style.display="none";
    document.getElementById("formView").style.display="none";
    document.getElementById("successView").style.display="block";
  }catch(e){
    notify("送出失敗："+e.message, "err");
  }finally{
    btn.disabled=false; btn.textContent="✓ 確認無誤，送出";
  }
});
</script>
</body>
</html>
